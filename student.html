{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.microBox{padding:14px;border-radius:13px;background:#edf4ef;border:1px solid #dce8de}.microBox.sarf{background:#f5f0e4;border-color:#eee0be}.microBox p,.card p{font-size:11px;color:#53635d;line-height:1.7}.tasks{display:grid;gap:8px;margin-top:12px}.task{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fffefa;font-size:10px;color:#52635b}.task input{margin-top:2px}.write{min-height:42px;border-bottom:1px solid #9daea3;margin:8px 0}.retrieval{margin-top:12px;background:#f7f7f1;border:1px solid var(--line);border-radius:12px;padding:13px}.checkpoint{background:var(--green);color:#fff;border-radius:16px;padding:22px}.checkpoint p{color:#d6e2dc}.checkpoint .term{background:#ffffff10;border-color:#ffffff33}.checkpoint .term .en{color:#d2e0d9}.checkpoint .term .ar{color:#f4ce7b}.review{max-width:720px;margin:15px auto}.flash{background:var(--green);color:#fff;border-radius:20px;min-height:310px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.flash .ar{font-size:65px;color:var(--amber);margin:15px 0}.flashTerm{font-size:30px;font-weight:700;margin:15px 0}.answer{font-size:16px;min-height:25px}.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.rating button{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:10px;font-weight:700;font-size:10px}.refGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tracker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.trackCard{border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:11px;text-align:center}.trackCard b{display:block;font-size:16px}.trackCard small{color:var(--muted);font-size:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--green);color:#fff;padding:10px 15px;border-radius:10px;font-siz .weekly-guide{margin:14px 0;padding:17px 18px;background:var(--paper);border:1px solid var(--line);border-radius:15px;min-width:0}
.weekly-guide h2{font-size:17px;line-height:1.25;margin:7px 0 9px;letter-spacing:-.35px}
.weekly-guide h3{font-size:13px;margin:0 0 7px}
.weekly-guide p{font-size:12px;line-height:1.7;color:var(--muted);margin:7px 0}
.weekly-guide a{font-size:11px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.guide-eyebrow{font-size:9px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--green2)}
.hifz-priority{border-left:5px solid var(--amber);background:linear-gradient(115deg,#fff8e8,#fffdf8)}
.hifz-priority h2{color:var(--green)}
.hifz-priority p{color:#44554e}
.guide-small{font-size:10px!important;color:var(--muted)!important}
.guide-check{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fffefa;font-size:11px;color:var(--ink);line-height:1.5}
.guide-check input{accent-color:var(--green);margin-top:3px;flex-shrink:0}
.guide-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:11px 0}
.guide-reveal:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.mushaf-reference{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:13px;margin:12px 0}
.mushaf-reference h3{font-size:16px;margin:6px 0}
.mushaf-task[hidden]{display:none!important}
.mushaf-application{font-weight:600;color:var(--ink)!important}
.guide-tasks{display:grid;gap:7px;margin:12px 0}
.appreciation-question{background:#f1f5ef;border:1px solid #dce6dc;padding:12px;border-radius:11px;margin-top:13px}
.appreciation-question b{font-size:11px}
.appreciation-question p{margin:5px 0 9px}
.reflection-lines{height:23px;border-bottom:1px solid #cbd8cc}
.fstu-focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fstu-focus{border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0;background:#f1f5ef}
.sarf-focus{background:#fbf5e8;border-color:#eee0c2}
.fstu-focus p{font-size:11px}
.edition-note{border:1px dashed #d0c08f;background:#fffaf0;border-radius:11px;padding:12px;margin:12px 0}
.edition-note b{font-size:11px}
.edition-note p{margin:6px 0 0}
.lesson-note{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:10px 0}
.lesson-note summary{font-size:11px;font-weight:700;cursor:pointer}
.optional-media{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}
.optional-media p{margin:6px 0}
@media(max-width:650px){.weekly-guide{padding:14px}.fstu-focus-grid{grid-template-columns:1fr}.guide-actions{align-items:flex-start;flex-direction:column}}
@media print{.mushaf-task[hidden]{display:block!important}.guide-reveal{display:none!important}.weekly-guide{break-inside:avoid}}

/* Layered source-page lesson */
.weekly-sequence{display:grid;gap:16px;margin:18px 0}
.sequence-overview{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#edf2ec;border:1px solid var(--line);border-radius:14px}
.sequence-node{display:flex;align-items:center;gap:7px;min-width:0;color:var(--muted);font-size:10px;font-weight:700}
.sequence-node span{display:grid;place-items:center;flex:0 0 27px;height:27px;border:1px solid #c9d6cc;border-radius:50%;background:#fff;color:var(--green2);font-size:10px}
.sequence-node.active span{background:var(--green);color:#fff;border-color:var(--green)}
.sequence-node.active b{color:var(--green)}
.sequence-line{height:1px;background:#ccd8ce;flex:1;min-width:8px}
.weekly-step{min-width:0;padding:clamp(15px,2.5vw,23px);background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow,0 6px 20px #172b2909)}
.step-topline{display:flex;gap:12px;align-items:center;margin-bottom:9px}
.step-number{display:grid;place-items:center;flex:0 0 39px;height:39px;background:var(--green);color:#fff;border-radius:12px;font-size:13px;font-weight:800}
.step-topline h2,.weekly-guide h2{font-size:clamp(18px,2.1vw,22px);line-height:1.22;letter-spacing:-.45px;margin:5px 0}
.step-intro{font-size:13px;line-height:1.7;color:var(--muted);margin:8px 0 15px}
.wudhu-confirm{margin:13px 0}
.mushaf-task[hidden]{display:none!important}
.mushaf-reference{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:13px;margin:14px 0}
.mushaf-reference h3{font-size:18px;line-height:1.35;margin:6px 0}
.mushaf-reference-meta{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.page-pill,.book-page-count{font-size:10px;font-weight:700;color:var(--green2);background:#e7efe8;border-radius:20px;padding:5px 9px}
.mushaf-application{font-weight:700;color:var(--ink)!important;line-height:1.65;margin:15px 0 9px!important}
.mushaf-transfer-note{background:#f0f5ef;border-left:4px solid var(--green2);border-radius:8px;padding:10px 13px;margin:12px 0}
.mushaf-transfer-note b{font-size:11px}.mushaf-transfer-note p{font-size:12px;margin:4px 0;color:var(--muted)}
.book-page-frame{width:100%;min-width:0;margin:9px 0 13px;background:#f1f3ee;border:1px solid #d7dfd8;border-radius:11px;overflow:hidden;text-align:center}
.book-page-placeholder{min-height:120px;display:grid;place-items:center;padding:18px;color:var(--muted);font-size:11px}
.book-page-figure{margin:0;padding:10px}
.source-page-image{display:block;width:100%;max-width:1000px;height:auto;max-height:none;margin:0 auto;background:#fff;border:1px solid #d8ded7;border-radius:5px;box-shadow:0 4px 18px #172b2910;cursor:zoom-in}
.book-page-figure figcaption{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted);font-size:10px;padding:8px 0 2px}
.page-zoom-text{border:0;background:none;text-decoration:underline;text-underline-offset:3px;color:var(--green2);font-size:10px;font-weight:700;padding:2px}
.book-page-missing{min-height:180px;padding:20px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:8px}
.book-page-missing b{font-size:13px}
.book-page-missing p{max-width:520px;margin:0;color:var(--muted);font-size:11px;line-height:1.6}
.book-missing-mark{display:grid;place-items:center;border-radius:50%;width:38px;height:38px;color:var(--green);background:#dfeae1;font-size:22px}
.book-upload-button{position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;gap:7px;border:1px solid #b9c9bd;background:#fffdf8;color:var(--green);border-radius:9px;padding:9px 13px;font-size:11px;font-weight:800;cursor:pointer}
.book-upload-button:hover{background:#edf4ed}
.book-upload-button input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.book-upload-button input[type=file]:disabled{cursor:progress}
.book-upload-button.is-busy{opacity:.6;cursor:progress}
.book-library-setup{border:1px solid #d4dfd5;background:#fffdf8}
.book-library-setup h2{font-size:19px}
.book-library-setup>p{font-size:12px;line-height:1.7;color:var(--muted)}
.book-upload-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}
.book-upload-card{display:flex;gap:10px;align-items:flex-start;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:#f7f8f3}
.book-upload-mark{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:10px;background:#e4eee5;color:var(--green);font:700 21px var(--ar,serif);direction:rtl}
.book-upload-copy{min-width:0;flex:1}
.book-upload-copy h3{font-size:12px;margin:0 0 5px;line-height:1.4}
.book-upload-copy p{font-size:10px;line-height:1.5;color:var(--muted);margin:4px 0 9px}
.book-upload-copy .book-status{font-weight:600;overflow-wrap:anywhere}
.textbook-focus-note{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.textbook-focus-item{border:1px solid #d7e2d8;border-radius:11px;background:#eff5ef;padding:12px}
.textbook-focus-item.nahw-focus{background:#fbf4e7;border-color:#eadebf}
.textbook-focus-item b{font-size:12px;color:var(--green)}
.textbook-focus-item p{font-size:11px;line-height:1.6;color:var(--muted);margin:5px 0 0}
.textbook-stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.textbook-panel{min-width:0;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fbfcf8}
.textbook-panel.sarf-panel{background:#fffaf0;border-color:#eadfbe}
.textbook-panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.textbook-panel-head h3{font-size:15px;margin:4px 0}
.textbook-panel>p{font-size:11px;line-height:1.65;color:var(--muted);margin:7px 0 10px}
.textbook-pages{display:grid;gap:12px}
.textbook-page{min-width:0}
.textbook-page-caption{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.textbook-page-caption b{color:var(--green);font-size:11px}
.listening-resources{padding:0;overflow:hidden;background:#f4f7f0;border:2px solid #c8d9cb}
.listen-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;background:#163c36;color:#fff;padding:19px 21px}
.listen-heading .guide-eyebrow{color:#e6c982}
.listen-heading h2{font-size:clamp(20px,2.6vw,26px);margin:5px 0 8px;color:#fff}
.listen-heading p{max-width:800px;color:#dce8df;font-size:12px;line-height:1.65;margin:0}
.listen-number{flex:0 0 45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#ffffff16;color:#e6c982;font-size:29px}
.playlist-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:12px;padding:13px}
.playlist-card{min-width:0;border:1px solid #d6e0d5;border-radius:12px;background:#fff;padding:14px}
.playlist-card.primary-playlist{border:2px solid #b9cdbd}
.playlist-label{font-size:9px;letter-spacing:.13em;font-weight:800;color:var(--green2)}
.playlist-card h3{font-size:16px;line-height:1.35;margin:6px 0}
.playlist-card p{font-size:11px;line-height:1.65;color:var(--muted);margin:6px 0 10px}
.playlist-player{position:relative;width:100%;aspect-ratio:16/9;background:#172b29;border-radius:9px;overflow:hidden;margin:10px 0}
.playlist-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.playlist-link{display:inline-flex;align-items:center;justify-content:center;margin-top:8px;border:1px solid #bbccbf;border-radius:9px;background:#f0f5ef;color:var(--green);padding:10px 12px;font-size:11px;font-weight:800;text-decoration:none}

olute:['Absolute object','مفعول مطلق'],particleChoice:['Particle function','وظيفة الحرف'],tarkib:['Word-by-word analysis','تركيب'],clause:['Clause','جملة'],weak:['Weak verb','فعل معتل'],manMa:['Context-sensitive من / ما','من / ما بحسب السياق']};

w(5,'Follow the links',563,['conjunction'],'Follow how links join words, phrases and complete statements.',[['عَلِيم','all-knowing'],['صَدْر','chest'],['رِزْق','provision'],['نُشُور','resurrection'],['سِرّ','secret'],['جَهَرَ','spoke openly'],['أَمِنَ','felt secure']],[['وَ','and'],['فَـ','so / then'],['ثُمَّ','then / afterwards'],['أَوْ','or'],['بَلْ','rather'],['لَكِنْ','but']],'A conjunction عطف can join similar items, show sequence, result, alternative or contrast.','Compare the action forms that repeat. Focus first on person and number encoded by the form.','Find three links on page 563 and explain what each link contributes.'),
w(6,'Read linked noun pairs',562,['idafah','mudaf','mudafIlayh','genitive'],'Recognise a two-part construction in which one noun is linked to another.',[['مَوْت','death'],['حَيَاة','life'],['طِبَاقًا','in layers'],['تَفَاوُت','irregularity / flaw'],['فُطُور','cracks'],['خَاسِئًا','humbled / repelled'],['حَسِير','exhausted / weary']],[['ذُو','possessor of'],['كُلّ','every / all'],['بَيْنَ','between'],['عِنْدَ','with / in the presence of'],['مِنْ','from'],['فِي','in']],'In an إضافة, the first noun is specified by the second. Read the pair as one unit.','Keep the whole word visible even inside a longer phrase.','Find an إضافة on page 562. Label مضاف and مضاف إليه and distinguish it from نعت.'),
w(7,'Track who is referred to',588,['pronoun','attachedPronoun','past','imperfect'],'Spot who is referred to when a form is attached to another word.',[['مُطَفِّفِينَ','those who give short measure'],['اكْتَالُوا','they took by measure'],['يَسْتَوْفُونَ','they take the full measure'],['كَالُوهُمْ','they measure for them'],['وَزَنُوهُمْ','they weigh for them'],['يُخْسِرُونَ','they cause loss'],['مَبْعُوثُونَ','to be raised / resurrected']],[['هُوَ','he / it'],['هُمْ','they'],['هِيَ','she / it'],['هُنَّ','they (feminine)'],['ـهُ','him / his / it'],['ـهُمْ','them / their']],'A ضمير may be separate or attached. Ask who is being referred to and what the reference connects to.','Read the full form. The attached piece may show the doer, recipient or possessor.','Choose three pronouns on page 588. Draw an arrow to what each refers to.'),
{n:8,title:'Checkpoint 1 — Al-Fātiḥah',page:1,checkpoint:true,focus:['noun','verb','particle','nominal','verbal','jarMajrur','conjunction','idafah','pronoun'],objective:'Retrieve the foundations without notes.',checks:['Label five words using the three paired word-type labels.','Identify one جملة اسمية and one جملة فعلية and explain the evidence.','Find two relationships between words and name them with English + Arabic terms.','Choose one action form and explain what clue shows who is involved.','Find one learned feature on another memorised page.']},
w(9,'Notice descriptions',583,['adjective','described','agreement','pronoun'],'Notice how a descriptive word matches the noun it describes.',[['مُتَّقِينَ','those mindful of Allah'],['مَفَاز','success / triumph'],['حَدَائِق','gardens'],['أَعْنَاب','grapes'],['كَأْس','cup'],['دِهَاق','full / overflowing'],['عَذَاب','punishment']],[['الَّذِي','who / which'],['هُوَ','he / it'],['مَا','what / whatever'],['ثُمَّ','then'],['لَا','not']],'A نعت often matches the منعوت in definiteness, gender, number and case ending. Check the evidence.','A familiar shape can suggest a descriptive role; confirm it from surrounding words.','Find one نعت + منعوت pair on page 583 and record the matching features.'),
w(10,'Follow a linked description',591,['relativePronoun','relativeClause'],'Find the word that opens a description and the clause that completes it.',[['الأَعْلَى','the Most High'],['سَوَّى','fashioned proportionately'],['هَدَى','guided'],['المَرْعَى','pasture'],['غُثَاء','withered debris'],['الأَشْقَى','the most wretched'],['تَزَكَّى','purified himself']],[['الَّذِي','who / which'],['الَّتِي','who / which (feminine)'],['مَنْ','whoever / who'],['مَا','what / whatever'],['إِنَّ','indeed']],'An اسم موصول opens a linked description. Read through the صلة الموصول that completes the meaning.','Look for repeated forms, especially where a form describes a person or action.','Find an اسم موصول on page 591 and mark the full صلة الموصول.'),
w(11,'Read the opening oath',600,['oath','particle','nominal'],'Recognise the oath marker (واو القسم) and the statement it frames.',[['العَادِيَات','the charging runners'],['ضَبْحًا','panting'],['المُورِيَات','those striking sparks'],['قَدْحًا','striking sparks'],['المُغِيرَات','those making a raid'],['صُبْحًا','at dawn'],['كَنُود','ungrateful']],[['وَ','and / by in an oath'],['إِذَا','when'],['إِنَّ','indeed'],['لَا','not'],['فَـ','then / so']],'Al-ʿĀdiyāt opens with an oath (قسم), not إنّ. Use the context and the statement that follows to identify the role of the opening و.','Read full verb forms where they occur; keep the oath and its response as the main structure.','Use FSTU Naḥw (نحو) p. 139 for oath sentences (قسم) and p. 27 as a general particle reference.'),
w(12,'Read the statement as a whole',592,['nominal','mubtada','khabar','adjective','described'],'Distinguish the predicate (خبر) from a descriptive adjective (نعت).',[['وُجُوه','faces'],['خَاشِعَة','humble / downcast'],['عَامِلَة','working'],['نَاصِبَة','weary'],['تَصْلَى','enters / burns in'],['آنِيَة','boiling hot'],['جَارِيَة','flowing']],[['هُوَ','he / it'],['مَا','what / not by context'],['إِنَّ','indeed'],['لَا','not'],['الَّذِينَ','those who']],'In وُجُوهٌ يَوْمَئِذٍ خَاشِعَةٌ, analyse the full nominal statement (جملة اسمية) before deciding whether خاشعة is a predicate (خبر) or adjective (نعت).','Use the complete phrase, not translation alone, to justify the grammatical relationship.','Use FSTU Naḥw (نحو) p. 34 for sentence structure and p. 65 to compare the descriptive phrase (نعت / منعوت).'),
w(13,'Notice what is denied',604,['negation','particle','imperfect','jussive'],'Identify the negation marker (حرف نفي) and the verb form it governs.',[['اللَّه','Allah'],['أَحَد','one / uniquely One'],['الصَّمَد','the eternally needed'],['لَمْ','did not'],['يَلِدْ','he begets'],['يُولَدْ','he is begotten'],['كُفُوًا','equal / equivalent']],[['لَا','not'],['مَا','not / what by context'],['لَمْ','did not'],['لَنْ','will not'],['إِنَّ','indeed']],'Read لَمْ يَلِدْ / وَلَمْ يُولَدْ. Identify لم and the imperfect verb (فعل مضارع) it governs; explain why the form is jussive (مجزوم).','Do not treat the negation marker as an isolated translation cue; compare it with the following form.','Use FSTU Naḥw (نحو) pp. 20–21 for negation and FSTU Ṣarf (صرف) pp. 57–58 for the form after the marker.'),
w(14,'Notice who receives an action',590,['passive','naib','past','verb'],'Recognise when an action is presented without naming its doer first.',[['بُرُوج','constellations'],['مَوْعُود','promised'],['مَشْهُود','witnessed'],['أُخْدُود','trench'],['وَقُود','fuel'],['بَطْش','seizing / force'],['شَهِيد','witness']],[['قُتِلَ','was destroyed / killed'],['إِذَا','when'],['مِنْ','from'],['فِي','in'],['وَ','and']],'In مبني للمجهول, the action remains central while the doer is not named in the usual way.','Compare the familiar completed-action pattern with the passive pattern.','Examine page 590. Identify the passive action and the نائب الفاعل.'),
w(15,'Compare active and passive participles',590,['derived','activeParticiple','passiveParticiple','pattern'],'Use word shape as evidence for an active participle (اسم الفاعل) and a passive participle (اسم المفعول).',[['بُرُوج','constellations'],['شَاهِد','witness'],['مَشْهُود','witnessed'],['يَوْم','day'],['مَوْعُود','promised'],['أُخْدُود','trench'],['وَقُود','fuel']],[['مِنْ','from'],['فِي','in'],['هُوَ','he / it'],['إِنَّ','indeed'],['لَا','not']],'Compare شَاهِدٍ وَمَشْهُودٍ on the page. The word shapes are clues to the active and passive participles; confirm each role from the phrase.','Compare the forms side by side and name the pattern only after you recognise the word in context.','Use FSTU Ṣarf (صرف) pp. 65 and 68 for participle forms, with FSTU Naḥw (نحو) p. 65 as a contrast for descriptive phrases.'),
{n:16,title:'Checkpoint 2 — Al-Fātiḥah',page:1,checkpoint:true,focus:['adjective','described','relativePronoun','relativeClause','inna','emphasis','kana','laysa','negation','passive','activeParticiple','passiveParticiple'],objective:'Retrieve the next layer and justify choices with Arabic evidence.',checks:['Identify one نعت + منعوت pair and explain which features match.','Find an اسم موصول and its صلة الموصول.','Explain what an emphatic or negating marker contributes.','Distinguish a regular action form from مبني للمجهول.','Explain one recurring structure on an unfamiliar memorised page.']},
w(17,'Read exception and restriction',442,['exception','negation','particle','restriction'],'Explain what the exception (استثناء) removes or restricts.',[['صَيْحَة','blast / cry'],['خَامِدُون','lifeless / extinguished'],['حَسْرَة','regret'],['مُحْضَرُون','brought forth'],['آيَة','sign'],['نَسْلَخُ','we strip away'],['فُلْك','ship / celestial orbit']],[['إِنْ','if'],['إِلَّا','except / only'],['مَنْ','whoever'],['مَا','what / whatever'],['فَـ','then / so']],'In إِلَّا صَيْحَةً وَاحِدَةً, identify what the marker limits in the whole statement; do not force a conditional reading onto this example.','First mark the boundary, then explain what remains in scope.','Use FSTU Naḥw (نحو) p. 56 for exclusion (استثناء), with p. 27 as a general particle reference.'),
w(18,'Read questions and direct address',587,['question','vocative','particle'],'Recognise a question (استفهام) and direct address (نداء) from the opening markers.',[['انْفَطَرَتْ','split open'],['انْتَثَرَتْ','scattered'],['بُعْثِرَتْ','turned upside down / scattered'],['سُجِّرَتْ','set ablaze / filled'],['أُزْلِفَتْ','brought near'],['كَرِيم','noble'],['كَاتِبِينَ','recording angels / writers']],[['مَا','what'],['يَا','O / direct address'],['أَيُّهَا','O you'],['هَلْ','is it / whether'],['أَ','question marker']],'On page 587, identify مَا غَرَّكَ بِرَبِّكَ الْكَرِيمِ and يَا أَيُّهَا الْإِنْسَانُ; compare question and vocative function.','Scan small markers, then read each complete phrase.','Use FSTU Naḥw (نحو) p. 127 for non-polar questions and p. 137 for direct address (نداء).'),
w(19,'Notice oaths and timing cues',593,['oath','zarf','condition'],'Notice how an oath or time marker frames the statement that follows.',[['فَجْر','dawn'],['لَيَالٍ','nights'],['الْوَتْر','the odd'],['يَسْر','to pass / move'],['عَاد','ʿĀd'],['إِرَم','Iram'],['ثَمُود','Thamūd']],[['وَ','and / by in an oath'],['إِذَا','when'],['إِنَّ','indeed'],['لَا','not'],['ثُمَّ','then']],'قسم strengthens what follows. ظرف places an event in time or place. Locate the opening marker first.','Recognise weak forms by their visible pattern and context.','On page 593 mark the oath opening and the statement it frames.'),
w(20,'Find time and place clues',584,['zarf','clause','subordinate'],'See how time and place expressions locate an event and how clauses connect.',[['الطَّامَّة','the overwhelming event'],['كُبْرَى','greatest / major'],['يَتَذَكَّرُ','remembers / takes heed'],['سَعَى','strived'],['الْجَحِيم','the blazing Fire'],['آثَرَ','preferred'],['مَأْوَى','refuge / abode']],[['إِذَا','when'],['مِنْ','from'],['فِي','in'],['ثُمَّ','then'],['وَ','and']],'A ظرف tells you when or where something happens. It may sit inside a larger جملة.','Read the form inside its phrase; do not detach it from what it modifies.','On page 584 find a time or place expression and explain what it attaches to.'),
w(21,'Follow the purpose expression',599,['purpose','purposeLam','jarMajrur'],'Recognise purpose lām (لام التعليل) and distinguish it from the purpose object (مفعول لأجله).',[['بَيِّنَة','clear proof'],['صُحُف','scriptures / pages'],['مُطَهَّرَة','purified'],['قَيِّمَة','upright'],['الْبَرِيَّة','creation'],['خَيْر','best'],['عَبَدَ','worshipped / served']],[['لِـ','for / in order to'],['مِنْ','from'],['فِي','in'],['إِنَّ','indeed'],['الَّذِينَ','those who']],'In لِيَعْبُدُوا اللهَ, the purpose lām (لام التعليل) links the action to its aim. FSTU p. 53 provides a comparison, not an identical form.','Read the whole verb and purpose expression together.','Use FSTU Naḥw (نحو) p. 53 as a comparison for reason/purpose; it teaches مفعول لأجله rather than this exact lām construction.'),
w(22,'Describe the situation',596,['haal','clause','adjective'],'Notice a word or expression that describes the state in which an action happens.',[['ضُحَى','forenoon'],['سَجَى','grew still / covered'],['وَدَّعَ','forsook'],['قَلَى','detested'],['آوَى','gave shelter'],['سَائِل','one who asks / petitioner'],['ضَالًّا','in need of guidance / astray']],[['وَ','and'],['فَـ','so / then'],['مَا','not / what by context'],['لَمْ','did not'],['إِنَّ','indeed']],'حال describes the state or circumstance during an action. Ask: in what state?','Use agreement and context together as evidence.','Find a حال on a memorised page and identify the person or thing whose state it describes.'),
w(23,'Find the dual noun',594,['dual','number','mafool'],'Recognise the dual noun (مثنّى) النجدين and use its ending as evidence.',[['بَلَد','land / city'],['كَبَد','hardship'],['وَالِد','parent / begetter'],['وَلَد','child'],['عَقَبَة','steep path'],['رَقَبَة','neck / person to free'],['مَسْغَبَة','hunger / famine']],[['مَا','what / whatever'],['لَا','not'],['هُوَ','he / it'],['كَانَ','was / used to be'],['إِلَّا','except']],'In وَهَدَيْنَاهُ النَّجْدَيْنِ, the dual noun refers to two paths. Justify the form from its ending and its role in the sentence.','A noun dual is not the same thing as a verbal pronoun; check the full form.','Use FSTU Naḥw (نحو) p. 12 for noun number and the dual (مثنّى).'),
{n:24,title:'Checkpoint 3 — Al-Fātiḥah',page:1,checkpoint:true,focus:['condition','result','exception','question','vocative','oath','zarf','purpose','haal','dual','number'],objective:'Use the structures together with minimal prompts.',checks:['Find a شرط, جواب الشرط or استثناء and mark the boundaries.','Explain an استفهام or نداء marker.','Find an expression of time, place, purpose or state and show what it attaches to.','Identify a form showing two or another number, with evidence.','Give a short تركيب and support it with visible Arabic clues.']},
w(25,'Use context to decide meaning',294,['manMa','relativePronoun','negation','particleChoice'],'Use context to distinguish recurring forms such as من and ما.',[['أَفْوَاه','mouths'],['كَذِبًا','falsehood'],['زِينَة','adornment'],['نَبْلُوَهُمْ','we test them'],['أَحْسَن','best'],['صَعِيدًا','surface / ground'],['جُرُزًا','barren']],[['مَنْ','whoever / who'],['مَا','what / whatever / not by context'],['الَّذِي','who / which'],['إِنْ','if'],['إِنَّ','indeed']],'The same written form can serve different functions. Check what follows, what the phrase needs and whether the meaning fits.','Do not force one translation onto a recurring form. Test its role against context.','Compare two uses of ما on page 294 and explain what changes with the context.'),
w(26,'Trace negation through كان',599,['negation','kana','nominal','jussive'],'Trace how negation affects the verb in a complete statement.',[['كَفَرُوا','disbelieved'],['الْمُشْرِكِينَ','polytheists'],['نَار','fire'],['خَالِدِينَ','remaining forever'],['عَدْن','perpetual residence'],['يَكُنْ','he be / was after لم'],['الْبَرِيَّة','creation']],[['لَمْ','did not'],['كَانَ','was / used to be'],['إِنَّ','indeed'],['هُوَ','he / it'],['الَّذِينَ','those who']],'Read لَمْ يَكُنِ الَّذِينَ كَفَرُوا as a whole. Identify لم and the role of the words that follow; do not treat the marker and verb as unrelated vocabulary.','The complete sentence determines the role of the noun of كان (اسم كان) and the connected clause.','Use FSTU Naḥw (نحو) pp. 20, 36 and 41 for negation and كان; FSTU Ṣarf (صرف) pp. 57–58 support form recognition.'),
w(27,'Explain the absolute object',593,['absolute','passive','pattern'],'Recognise the absolute object (مفعول مطلق) as a verbal-noun expression connected to an action.',[['دَكًّا','a shattering'],['صَفًّا','in rows'],['جِيءَ','was brought'],['جَهَنَّم','Hell'],['الْمَلَك','the angels'],['ارْجِعِي','return (feminine singular command)'],['ادْخُلِي','enter (feminine singular command)']],[['إِذَا','when'],['وَ','and'],['فَـ','so / then'],['إِنَّ','indeed'],['لَا','not']],'In دُكَّتِ الْأَرْضُ دَكًّا دَكًّا, compare the passive verb (فعل مبني للمجهول) and the repeated verbal-noun expression.','The verbal noun shares the action root; the construction tells you its role.','Use FSTU Naḥw (نحو) p. 52 for مفعول مطلق للعدد; FSTU Ṣarf (صرف) pp. 70 and 72 support root recognition.'),
w(28,'Follow connected statements',293,['clause','relativeClause','tarkib','conjunction'],'Analyse a larger passage by separating the main idea from connected clauses.',[['عِوَجًا','crookedness'],['قَيِّمًا','upright / straight'],['عَبْد','servant'],['يُبَشِّرُ','gives glad tidings'],['الصَّالِحَات','righteous deeds'],['لَدُنْهُ','from Him'],['بَأْسًا','severe punishment']],[['وَ','and'],['فَـ','so / then'],['ثُمَّ','then'],['أَوْ','or'],['بَلْ','rather'],['لَكِنْ','but']],'Longer statements contain smaller connected units. Identify the main جملة, then work through the linked unit.','Compare repeated forms and notice how the person changes.','On page 293 mark الَّذِي and its صلة الموصول; then do the same for الَّذِينَ.'),
w(29,'Trace the links',602,['conjunction','clause','tarkib'],'Track boundaries created by common links.',[['أَرَأَيْتَ','have you seen?'],['يَدُعُّ','repels harshly'],['يَتِيم','orphan'],['مِسْكِين','needy person'],['سَاهُون','heedless'],['يُرَاءُونَ','show off'],['المَاعُون','small kindness / assistance']],[['وَ','and'],['فَـ','so / then'],['ثُمَّ','then'],['أَوْ','or'],['بَلْ','rather'],['لَكِنْ','but']],'عطف can connect words, phrases or complete units. Mark both boundaries and explain the connection.','Repeated action forms in a short sūrah help you notice who is being described.','Find three links on the chosen page and explain what each connects.'),
w(30,'Read connected phrases in short sūrahs',604,['idafah','mudaf','mudafIlayh','preposition','jarMajrur'],'Read possessive and prepositional phrases as connected relationships.',[['أَحَد','one / uniquely One'],['الصَّمَد','the eternally needed'],['يَلِد','begets'],['يُولَد','is begotten'],['كُفُوًا','equal / equivalent'],['فَلَق','daybreak'],['النَّاس','humankind / people']],[['مِنْ','from'],['بِـ','in / with'],['إِلَى','to'],['رَبِّ','Lord of'],['شَرِّ','evil of'],['الَّذِي','who / which']],'Find مِنْ شَرِّ as جار ومجرور and رَبِّ الْفَلَقِ / رَبِّ النَّاسِ as إضافة. A phrase can contain more than one grammatical relationship.','Read the complete expression and identify which words are connected by the preposition and which make the iḍāfah.','Use FSTU Naḥw (نحو) pp. 72 and 84 for possessive and prepositional phrases.'),
{n:31,title:'Analyse a fresh Qur’an passage',page:null,capstone:true,focus:['tarkib','noun','verb','particle','nominal','verbal','jarMajrur','idafah','relativeClause','conjunction'],objective:'Begin an independent word-by-word analysis and justify every important choice.',hf:[['مِنْ','from'],['فِي','in'],['عَلَى','on'],['إِنَّ','indeed'],['لَا','not'],['وَ','and']],nahw:'Work from visible evidence. Classify words, identify the main structure, mark relationships, then combine the parts.',sarf:'Use word shape, root, ending and attached pieces as clues. Leave a label uncertain rather than forcing it.',apply:'Choose a full page from your own memorised Qur’an. Select seven useful words and analyse one short passage independently.'}
];
const STORE='8020-student-v2';let state=load(),view='home',selected=1,reviewMode='words',queue=[],pos=0,revealed=false;
function blank(){return{done:{},cards:{}}}function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return blank()}}function save(){localStorage.setItem(STORE,JSON.stringify(state));updateSide()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function annotatedText(x){return window.GrammarTerms?GrammarTerms.annotateText(x):esc(x)}
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function done(){return Object.values(state.done).filter(Boolean).length}function pct(){return Math.round(done()/31*100)}function updateSide(){document.getElementById('sideBar').style.width=pct()+'%';document.getElementById('sideDone').textContent=done()+'/31';document.getElementById('sidePct').textContent=pct()+'%'}
function wordCards(){return C.flatMap(x=>(x.words||[]).map((w,i)=>({key:`w${x.n}-${i}`,ar:w[0],en:w[1],week:x.n,kind:'word'})))}
function highCards(){let a=[],seen=new Set();C.forEach(x=>(x.hf||[]).forEach(w=>{if(!seen.has(w[0])){seen.add(w[0]);a.push({key:'h-'+w[0],ar:w[0],en:w[1],kind:'high'})}}));return a}
function termCards(){return Object.entries(TERMS).map(([k,v])=>{let reading=window.GrammarTerms?GrammarTerms.get(k,v[1]):{ar:v[1],latin:""};return {key:'t-'+k,en:v[0],ar:reading.ar||v[1],latin:reading.latin||"",kind:'term'}})}
function cards(){return reviewMode==='terms'?termCards():reviewMode==='high'?highCards():wordCards()}
function nextWeek(){return C.find(x=>!state.done[x.n])||C[30]}
function summary(x){return x.checkpoint?'Al-Fātiḥah retrieval checkpoint':x.capstone?'Choose your own memorised page':`Madani 15-line Mushaf · p. ${x.page} · ${x.title}`}
function weekButton(x){return `<button class="week ${state.done[x.n]?'done':''}" data-week="${x.n}"><span class="num">${state.done[x.n]?'✓':String(x.n).padStart(2,'0')}</span><span><b>Week ${x.n} · ${esc(x.title)}</b><small>${esc(summary(x))}</small></span><span class="status eyebrow">${state.done[x.n]?'DONE':'OPEN →'}</span></button>`}
function home(){let n=nextWeek(),known=wordCards().filter(x=>(state.cards[x.key]?.reps||0)>=4).length;document.getElementById('main').innerHTML=`<section class="hero"><div><div class="kicker">SOURCE-FIRST · 80/20 METHOD</div><h1>Understand the rule.<br>Recognise it in Qur’an.</h1><p>Study the assigned FSTU page and its worked example first. Explain the concept, then apply it to a 15-line Qur’an page and justify the Arabic evidence. Hifz remains the priority.</p><div class="actions"><button class="btn gold" id="continue">Continue Week ${n.n} →</button><button class="btn light" id="reviewBtn">5-minute review</button></div></div><div class="heroGlyph ar">ع</div></section>${WeeklyGuide.renderPriority()}${WeeklyGuide.renderLibrarySetup()}<div class="metrics"><div class="metric"><small>COURSE PROGRESS</small><strong>${pct()}%</strong><span>${done()} of 31 weeks</span></div><div class="metric"><small>WORDS ESTABLISHED</small><strong>${known}</strong><span>4+ successful recalls</span></div><div class="metric"><small>REVIEW CARDS</small><strong>${Object.keys(state.cards).length}</strong><span>stored locally</span></div><div class="metric"><small>WEEKLY CLASS</small><strong>45m</strong><span>plus short practice</span></div></div><div class="grid2"><section class="card"><div class="eyebrow">NEXT LESSON</div><h2>Week ${n.n} · ${esc(n.title)}</h2><div class="target"><div class="eyebrow">TARGET</div>${tr(n.focus)}<p>${esc(n.objective)}</p></div><button class="btn" id="open">Open lesson →</button></section><section class="card"><div class="eyebrow">FAST MASTERY LOOP</div><div class="tasks"><div class="task"><b>1</b><span><strong>Retrieve</strong><br>Try before looking.</span></div><div class="task"><b>2</b><span><strong>Recognise</strong><br>Spot the Arabic evidence.</span></div><div class="task"><b>3</b><span><strong>Explain</strong><br>Name the English + Arabic term.</span></div><div class="task"><b>4</b><span><strong>Transfer</strong><br>Find it on another page.</span></div></div></section></div><div class="phase">UP NEXT</div><div class="weekList">${C.filter(x=>x.n>=n.n&&x.n<n.n+3).map(weekButton).join('')}</div>`;document.getElementById('continue').onclick=()=>open(n.n);document.getElementById('open').onclick=()=>open(n.n);document.getElementById('reviewBtn').onclick=()=>startReview('words');bindWeeks();}
function course(){let groups=[['PHASE 1 · FOUNDATIONS',C.slice(0,7)],['CHECKPOINT 1',C.slice(7,8)],['PHASE 2 · RELATIONSHIPS',C.slice(8,15)],['CHECKPOINT 2',C.slice(15,16)],['PHASE 3 · CONNECTED MEANING',C.slice(16,23)],['CHECKPOINT 3',C.slice(23,24)],['PHASE 4 · INDEPENDENT READING',C.slice(24,31)]];document.getElementById('main').innerHTML=`<div class="kicker">THE FULL PATH</div><h1>31 weeks to independent reading</h1><p class="card" style="color:var(--muted)">The sequence deliberately moves from recognition → relationships → connected meaning → independent analysis. Grammar terms are always stored as English + Arabic pairs.</p>${groups.map(g=>`<div class="phase">${g[0]}</div><div class="weekList">${g[1].map(weekButton).join('')}</div>`).join('')}`;bindWeeks()}
function bindWeeks(){document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>open(+b.dataset.week))}
function open(n){selected=n;view='lesson';render()}
function lesson(x){let s=x.checkpoint?checkpoint(x):lessonBody(x);if(x.checkpoint)s+=WeeklyGuide.renderSequence(x.n,{esc:esc});document.getElementById('main').innerHTML=`<div class="lessonHead"><div><button class="btn light noPrint" id="back">← Course</button><div class="kicker">WEEK ${String(x.n).padStart(2,'0')} · ${x.checkpoint?'RETRIEVAL CHECKPOINT':'45-MINUTE CLASS'}</div><h1>${esc(x.title)}</h1><p>${esc(summary(x))}</p></div></div>${WeeklyGuide.renderPriority()}${s}<section class="card noPrint" style="margin-top:13px"><div class="eyebrow">FINISH</div><p>Before you finish, explain the main idea without notes and point to one Arabic clue.</p><label class="task"><input type="checkbox" id="complete" ${state.done[x.n]?'checked':''}> I can recognise this feature and explain one Arabic clue.</label><div class="actions" style="margin-top:10px"><button class="btn" id="saveWeek">${state.done[x.n]?'Update completion':'Mark week complete'}</button><button class="btn light" id="next">Next week →</button><button class="btn light" id="printLesson">Print lesson</button></div></section>`;document.getElementById('back').onclick=()=>{view='course';render()};document.getElementById('saveWeek').onclick=()=>{state.done[x.n]=document.getElementById('complete').checked;save();toast(state.done[x.n]?'Week completed':'Completion removed');lesson(x)};document.getElementById('next').onclick=()=>open(Math.min(31,x.n+1));document.getElementById('printLesson').onclick=()=>window.print();bindReveal();WeeklyGuide.bind(x.n)}
function lessonBody(x){let words=x.capstone?Array.from({length:7},(_,i)=>`<div class="word"><div class="eyebrow">YOUR WORD ${i+1}</div><input class="cue ar" placeholder="اكتب الكلمة هنا" aria-label="Arabic word ${i+1}"><input class="cue" placeholder="meaning / root / cue"></div>`).join(''):x.words.map((z,i)=>`<div class="word"><span class="ar">${esc(z[0])}</span><div class="meaning hidden" id="m${x.n}-${i}">${esc(z[1])}</div><button data-reveal="${x.n}-${i}">Reveal meaning</button><input class="cue" placeholder="my memory cue" aria-label="memory cue"></div>`).join('');return `<section class="card" style="margin-top:14px"><div class="eyebrow">THIS WEEK’S TARGET · ENGLISH + ARABIC</div>${tr(x.focus)}<p>${annotatedText(x.objective)}</p></section><div class="lessonGrid"><section class="card"><div class="eyebrow">${x.capstone?'CHOOSE SEVEN WORDS':'7 NEW QUR’AN WORDS'}</div><div class="words" style="margin-top:9px">${words}</div></section><section><div class="high"><div class="eyebrow">HIGH-FREQUENCY QUR’AN WORDS</div><p>These recurring function words have their own review set; they do not consume the seven lexical-word slots.</p><div class="highWords">${(x.hf||[]).map(z=>`<span class="highWord"><span class="ar">${esc(z[0])}</span><small>${esc(z[1])}</small></span>`).join('')}</div></div><div class="micro"><div class="microBox"><div class="eyebrow">NAḤW · نحو</div><p>${annotatedText(WeeklyGuide.get(x.n).nahw)}</p>${tr(x.focus.filter(k=>['noun','verb','particle','nominal','verbal','mubtada','khabar','faail','mafool','preposition','genitive','jarMajrur','conjunction','idafah','pronoun','adjective','relativePronoun','relativeClause','inna','emphasis','kana','laysa','negation','jussive','subjunctive','passive','naib','condition','result','exception','question','vocative','oath','zarf','purpose','purposeLam','haal','dual','number','restriction','absolute','particleChoice','tarkib','agreement','manMa'].includes(k)))}</div><div class="microBox sarf"><div class="eyebrow">ṢARF · صرف</div><p>${annotatedText(WeeklyGuide.get(x.n).sarf)}</p>${tr(x.focus.filter(k=>['past','imperfect','imperative','attachedPronoun','derived','activeParticiple','passiveParticiple','pattern','root','conjugation','weak'].includes(k)))}</div></div></section></div>${WeeklyGuide.renderSequence(x.n,{passage:x.passage,apply:x.apply,nahw:x.nahw,sarf:x.sarf,esc:esc})}`}
function checkpoint(x){return `<section class="checkpoint" style="margin-top:14px"><div class="eyebrow" style="color:#a9c4b6">AL-FĀTIḤAH · NO NOTES FIRST</div><h2>${esc(x.title)}</h2><p>${annotatedText(x.objective)}</p>${tr(x.focus)}<div class="retrieval" style="margin-top:14px;background:#fff;color:var(--ink)"><b>Checkpoint rule:</b> use the Arabic evidence to justify each answer. The weekly source-page sequence and recognition test follow below.</div></section>`}
function bindReveal(){document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{let e=document.getElementById('m'+b.dataset.reveal);e.classList.toggle('hidden');b.textContent=e.classList.contains('hidden')?'Reveal meaning':'Hide meaning'})}
function review(){let list=cards(),due=list.filter(x=>state.cards[x.key]?.due<=today());if(!due.length)due=list.filter(x=>!(state.cards[x.key]?.reps));if(!due.length)due=list.slice(0,10);queue=due.slice(0,10);pos=0;revealed=false;view='review';render()}
function startReview(m){reviewMode=m;review();}
function today(){return new Date().toISOString().slice(0,10)}function addDays(n){let d=new Date(today()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function reviewView(){if(!queue.length){review();return}let c=queue[pos];let termMode=c.kind==='term';document.getElementById('main').innerHTML=`<div class="kicker">5-MINUTE RETRIEVAL · ${reviewMode==='terms'?'ENGLISH ↔ ARABIC TERMS':reviewMode==='high'?'HIGH-FREQUENCY':'QUR’AN VOCABULARY'}</div><h1>Make recall automatic</h1><div class="actions noPrint"><button class="btn ${reviewMode==='words'?'':'light'}" id="rw">Qur’an vocabulary</button><button class="btn ${reviewMode==='high'?'':'light'}" id="rh">High-frequency words</button><button class="btn ${reviewMode==='terms'?'':'light'}" id="rt">Grammar terms · مصطلحات</button></div><div class="review"><div class="flash"><div class="eyebrow" style="color:#c7d8d0">CARD ${pos+1} OF ${queue.length}</div>${termMode?`<div class="flashTerm">${esc(c.en)}</div>`:`<span class="ar">${esc(c.ar)}</span>`}<div class="answer">${revealed?(termMode?`<span class="ar">${esc(c.ar)}</span>${c.latin?`<small class="term-translit flashTermTranslit" lang="en" dir="ltr">${esc(c.latin)}</small>`:""}`:esc(c.en)):(termMode?'Recall the Arabic term':'Try to recall the meaning')}</div><button class="topBtn" id="reveal" style="margin-top:16px">${revealed?'Answer revealed':'Reveal answer'}</button></div>${revealed?`<div class="rating"><button data-rate="again">Again<br><small>not recalled</small></button><button data-rate="hard">Hard<br><small>needed effort</small></button><button data-rate="good">Good<br><small>recalled</small></button><button data-rate="easy">Easy<br><small>instant</small></button></div>`:''}</div>`;document.getElementById('rw').onclick=()=>startReview('words');document.getElementById('rh').onclick=()=>startReview('high');document.getElementById('rt').onclick=()=>startReview('terms');document.getElementById('reveal').onclick=()=>{revealed=true;reviewView()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(c,b.dataset.rate))}
function rate(c,r){let p=state.cards[c.key]||{reps:0,interval:0,ease:2.4};let iv=1;if(r==='again'){p.reps=0;p.ease=Math.max(1.3,p.ease-.2);iv=0}else if(r==='hard'){p.reps++;p.ease=Math.max(1.3,p.ease-.12);iv=Math.max(1,Math.round((p.interval||1)*1.35))}else if(r==='good'){p.reps++;iv=p.interval?Math.max(2,Math.round(p.interval*p.ease)):2}else{p.reps++;p.ease=Math.min(3.1,p.ease+.15);iv=p.interval?Math.max(4,Math.round(p.interval*(p.ease+.8))):4}p.interval=iv;p.due=iv?addDays(iv):today();state.cards[c.key]=p;save();pos++;revealed=false;if(pos>=queue.length){toast('Review set complete');queue=[]}else render()}
function terms(){document.getElementById('main').innerHTML=`<div class="kicker">BILINGUAL GRAMMAR MAP</div><h1>English ↔ Arabic terminology</h1><p class="card" style="color:var(--muted)">Every technical grammar label is paired. Say both sides aloud. Cover one side and retrieve the other.</p><div class="refGrid">${Object.keys(TERMS).map(k=>`<div class="card">${t(k)}</div>`).join('')}</div>`}
function progress(){let known=wordCards().filter(x=>(state.cards[x.key]?.reps||0)>=4).length;document.getElementById('main').innerHTML=`<div class="kicker">YOUR RECORD</div><h1>Progress you can trust</h1><div class="metrics"><div class="metric"><small>WEEKS COMPLETE</small><strong>${done()}/31</strong></div><div class="metric"><small>WORDS ESTABLISHED</small><strong>${known}</strong></div><div class="metric"><small>CARDS REVIEWED</small><strong>${Object.keys(state.cards).length}</strong></div><div class="metric"><small>COURSE</small><strong>${pct()}%</strong></div></div><section class="card"><div class="eyebrow">PHASE PROGRESS</div><div class="tracker" style="margin-top:12px">${[['Foundations',1,7],['Relationships',9,15],['Connected meaning',17,23],['Independent reading',25,31]].map(p=>{let d=0;for(let i=p[1];i<=p[2];i++)d+=state.done[i]?1:0;return `<div class="trackCard"><b>${d}/${p[2]-p[1]+1}</b><small>${p[0]}</small></div>`}).join('')}</div></section><section class="card" style="margin-top:12px"><div class="eyebrow">KEEP IT PORTABLE</div><p>Progress stays in this browser. Export a backup before changing device. On a shared device, export first, then reset before another learner starts.</p><div class="actions"><button class="btn" id="export2">Export progress</button><button class="btn light" id="resetStudioProgress">Reset this device for next student</button></div></section>`;document.getElementById('export2').onclick=exportProgress;document.getElementById('resetStudioProgress').onclick=()=>{if(confirm("Reset this browser for another student? First export a teacher progress record. This removes course progress, vocabulary reviews, grammar evidence, quizzes and the saved learner label.")){localStorage.removeItem(STORE);localStorage.removeItem("8020-word-recognition-v1");localStorage.removeItem("8020-weekly-recall-v2");localStorage.removeItem("8020-learner-profile-v1");state=load();toast("This browser is ready for another learner");view='progress';render()}};if(window.LearnerTools)LearnerTools.mountProfilePanel(document.getElementById('main'),"student-studio",function(){return state})}
function exportProgress(){if(window.LearnerTools){LearnerTools.download(state,"student-studio");toast("Class progress record exported");return}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='80-20-arabic-student-progress.json';a.click();URL.revokeObjectURL(a.href);toast('Progress exported')}
function render(){updateSide();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='home')home();else if(view==='course')course();else if(view==='lesson')lesson(C.find(x=>x.n===selected));else if(view==='review')reviewView();else if(view==='terms')terms();else progress()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('export').onclick=exportProgress;document.getElementById('print').onclick=()=>window.print();render();
</script>
</body></html>
