{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.microBox{padding:14px;border-radius:13px;background:#edf4ef;border:1px solid #dce8de}.microBox.sarf{background:#f5f0e4;border-color:#eee0be}.microBox p,.card p{font-size:11px;color:#53635d;line-height:1.7}.tasks{display:grid;gap:8px;margin-top:12px}.task{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fffefa;font-size:10px;color:#52635b}.task input{margin-top:2px}.write{min-height:42px;border-bottom:1px solid #9daea3;margin:8px 0}.retrieval{margin-top:12px;background:#f7f7f1;border:1px solid var(--line);border-radius:12px;padding:13px}.checkpoint{background:var(--green);color:#fff;border-radius:16px;padding:22px}.checkpoint p{color:#d6e2dc}.checkpoint .term{background:#ffffff10;border-color:#ffffff33}.checkpoint .term .en{color:#d2e0d9}.checkpoint .term .ar{color:#f4ce7b}.review{max-width:720px;margin:15px auto}.flash{background:var(--green);color:#fff;border-radius:20px;min-height:310px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.flash .ar{font-size:65px;color:var(--amber);margin:15px 0}.flashTerm{font-size:30px;font-weight:700;margin:15px 0}.answer{font-size:16px;min-height:25px}.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.rating button{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:10px;font-weight:700;font-size:10px}.refGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tracker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.trackCard{border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:11px;text-align:center}.trackCard b{display:block;font-size:16px}.trackCard small{color:var(--muted);font-size:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--green);color:#fff;padding:10px 15px;border-radius:10px;font-siz .weekly-guide{margin:14px 0;padding:17px 18px;background:var(--paper);border:1px solid var(--line);border-radius:15px;min-width:0}
.weekly-guide h2{font-size:17px;line-height:1.25;margin:7px 0 9px;letter-spacing:-.35px}
.weekly-guide h3{font-size:13px;margin:0 0 7px}
.weekly-guide p{font-size:12px;line-height:1.7;color:var(--muted);margin:7px 0}
.weekly-guide a{font-size:11px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.guide-eyebrow{font-size:9px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--green2)}
.hifz-priority{border-left:5px solid var(--amber);background:linear-gradient(115deg,#fff8e8,#fffdf8)}
.hifz-priority h2{color:var(--green)}
.hifz-priority p{color:#44554e}
.guide-small{font-size:10px!important;color:var(--muted)!important}
.guide-check{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fffefa;font-size:11px;color:var(--ink);line-height:1.5}
.guide-check input{accent-color:var(--green);margin-top:3px;flex-shrink:0}
.guide-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:11px 0}
.guide-reveal:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.mushaf-reference{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:13px;margin:12px 0}
.mushaf-reference h3{font-size:16px;margin:6px 0}
.mushaf-task[hidden]{display:none!important}
.mushaf-application{font-weight:600;color:var(--ink)!important}
.guide-tasks{display:grid;gap:7px;margin:12px 0}
.appreciation-question{background:#f1f5ef;border:1px solid #dce6dc;padding:12px;border-radius:11px;margin-top:13px}
.appreciation-question b{font-size:11px}
.appreciation-question p{margin:5px 0 9px}
.reflection-lines{height:23px;border-bottom:1px solid #cbd8cc}
.fstu-focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fstu-focus{border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0;background:#f1f5ef}
.sarf-focus{background:#fbf5e8;border-color:#eee0c2}
.fstu-focus p{font-size:11px}
.edition-note{border:1px dashed #d0c08f;background:#fffaf0;border-radius:11px;padding:12px;margin:12px 0}
.edition-note b{font-size:11px}
.edition-note p{margin:6px 0 0}
.lesson-note{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:10px 0}
.lesson-note summary{font-size:11px;font-weight:700;cursor:pointer}
.optional-media{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}
.optional-media p{margin:6px 0}
@media(max-width:650px){.weekly-guide{padding:14px}.fstu-focus-grid{grid-template-columns:1fr}.guide-actions{align-items:flex-start;flex-direction:column}}
@media print{.mushaf-task[hidden]{display:block!important}.guide-reveal{display:none!important}.weekly-guide{break-inside:avoid}}

/* Layered source-page lesson */
.weekly-sequence{display:grid;gap:16px;margin:18px 0}
.sequence-overview{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#edf2ec;border:1px solid var(--line);border-radius:14px}
.sequence-node{display:flex;align-items:center;gap:7px;min-width:0;color:var(--muted);font-size:10px;font-weight:700}
.sequence-node span{display:grid;place-items:center;flex:0 0 27px;height:27px;border:1px solid #c9d6cc;border-radius:50%;background:#fff;color:var(--green2);font-size:10px}
.sequence-node.active span{background:var(--green);color:#fff;border-color:var(--green)}
.sequence-node.active b{color:var(--green)}
.sequence-line{height:1px;background:#ccd8ce;flex:1;min-width:8px}
.weekly-step{min-width:0;padding:clamp(15px,2.5vw,23px);background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow,0 6px 20px #172b2909)}
.step-topline{display:flex;gap:12px;align-items:center;margin-bottom:9px}
.step-number{display:grid;place-items:center;flex:0 0 39px;height:39px;background:var(--green);color:#fff;border-radius:12px;font-size:13px;font-weight:800}
.step-topline h2,.weekly-guide h2{font-size:clamp(18px,2.1vw,22px);line-height:1.22;letter-spacing:-.45px;margin:5px 0}
.step-intro{font-size:13px;line-height:1.7;color:var(--muted);margin:8px 0 15px}
.wudhu-confirm{margin:13px 0}
.mushaf-task[hidden]{display:none!important}
.mushaf-reference{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:13px;margin:14px 0}
.mushaf-reference h3{font-size:18px;line-height:1.35;margin:6px 0}
.mushaf-reference-meta{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.page-pill,.book-page-count{font-size:10px;font-weight:700;color:var(--green2);background:#e7efe8;border-radius:20px;padding:5px 9px}
.mushaf-application{font-weight:700;color:var(--ink)!important;line-height:1.65;margin:15px 0 9px!important}
.mushaf-transfer-note{background:#f0f5ef;border-left:4px solid var(--green2);border-radius:8px;padding:10px 13px;margin:12px 0}
.mushaf-transfer-note b{font-size:11px}.mushaf-transfer-note p{font-size:12px;margin:4px 0;color:var(--muted)}
.book-page-frame{width:100%;min-width:0;margin:9px 0 13px;background:#f1f3ee;border:1px solid #d7dfd8;border-radius:11px;overflow:hidden;text-align:center}
.book-page-placeholder{min-height:120px;display:grid;place-items:center;padding:18px;color:var(--muted);font-size:11px}
.book-page-figure{margin:0;padding:10px}
.source-page-image{display:block;width:100%;max-width:1000px;height:auto;max-height:none;margin:0 auto;background:#fff;border:1px solid #d8ded7;border-radius:5px;box-shadow:0 4px 18px #172b2910;cursor:zoom-in}
.book-page-figure figcaption{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted);font-size:10px;padding:8px 0 2px}
.page-zoom-text{border:0;background:none;text-decoration:underline;text-underline-offset:3px;color:var(--green2);font-size:10px;font-weight:700;padding:2px}
.book-page-missing{min-height:180px;padding:20px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:8px}
.book-page-missing b{font-size:13px}
.book-page-missing p{max-width:520px;margin:0;color:var(--muted);font-size:11px;line-height:1.6}
.book-missing-mark{display:grid;place-items:center;border-radius:50%;width:38px;height:38px;color:var(--green);background:#dfeae1;font-size:22px}
.book-upload-button{position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;gap:7px;border:1px solid #b9c9bd;background:#fffdf8;color:var(--green);border-radius:9px;padding:9px 13px;font-size:11px;font-weight:800;cursor:pointer}
.book-upload-button:hover{background:#edf4ed}
.book-upload-button input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.book-upload-button input[type=file]:disabled{cursor:progress}
.book-upload-button.is-busy{opacity:.6;cursor:progress}
.book-library-setup{border:1px solid #d4dfd5;background:#fffdf8}
.book-library-setup h2{font-size:19px}
.book-library-setup>p{font-size:12px;line-height:1.7;color:var(--muted)}
.book-upload-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}
.book-upload-card{display:flex;gap:10px;align-items:flex-start;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:#f7f8f3}
.book-upload-mark{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:10px;background:#e4eee5;color:var(--green);font:700 21px var(--ar,serif);direction:rtl}
.book-upload-copy{min-width:0;flex:1}
.book-upload-copy h3{font-size:12px;margin:0 0 5px;line-height:1.4}
.book-upload-copy p{font-size:10px;line-height:1.5;color:var(--muted);margin:4px 0 9px}
.book-upload-copy .book-status{font-weight:600;overflow-wrap:anywhere}
.textbook-focus-note{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.textbook-focus-item{border:1px solid #d7e2d8;border-radius:11px;background:#eff5ef;padding:12px}
.textbook-focus-item.nahw-focus{background:#fbf4e7;border-color:#eadebf}
.textbook-focus-item b{font-size:12px;color:var(--green)}
.textbook-focus-item p{font-size:11px;line-height:1.6;color:var(--muted);margin:5px 0 0}
.textbook-stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.textbook-panel{min-width:0;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fbfcf8}
.textbook-panel.sarf-panel{background:#fffaf0;border-color:#eadfbe}
.textbook-panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.textbook-panel-head h3{font-size:15px;margin:4px 0}
.textbook-panel>p{font-size:11px;line-height:1.65;color:var(--muted);margin:7px 0 10px}
.textbook-pages{display:grid;gap:12px}
.textbook-page{min-width:0}
.textbook-page-caption{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.textbook-page-caption b{color:var(--green);font-size:11px}
.listening-resources{padding:0;overflow:hidden;background:#f4f7f0;border:2px solid #c8d9cb}
.listen-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;background:#163c36;color:#fff;padding:19px 21px}
.listen-heading .guide-eyebrow{color:#e6c982}
.listen-heading h2{font-size:clamp(20px,2.6vw,26px);margin:5px 0 8px;color:#fff}
.listen-heading p{max-width:800px;color:#dce8df;font-size:12px;line-height:1.65;margin:0}
.listen-number{flex:0 0 45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#ffffff16;color:#e6c982;font-size:29px}
.playlist-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:12px;padding:13px}
.playlist-card{min-width:0;border:1px solid #d6e0d5;border-radius:12px;background:#fff;padding:14px}
.playlist-card.primary-playlist{border:2px solid #b9cdbd}
.playlist-label{font-size:9px;letter-spacing:.13em;font-weight:800;color:var(--green2)}
.playlist-card h3{font-size:16px;line-height:1.35;margin:6px 0}
.playlist-card p{font-size:11px;line-height:1.65;color:var(--muted);margin:6px 0 10px}
.playlist-player{position:relative;width:100%;aspect-ratio:16/9;background:#172b29;border-radius:9px;overflow:hidden;margin:10px 0}
.playlist-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.playlist-link{display:inline-flex;align-items:center;justify-content:center;margin-top:8px;border:1px solid #bbccbf;border-radius:9px;background:#f0f5ef;color:var(--green);padding:10px 12px;font-size:11px;font-weight:800;text-decoration:none}

<body>
<header class="top"><a class="brand" href="./student.html"><span class="mark ar">ع</span><span><b>80/20 Arabic</b><small>Student Studio</small></span></a><div class="topBtns"><button class="topBtn" id="print">Print lesson</button><button class="topBtn" id="export">Export progress</button></div></header>
<div class="layout"><aside><div class="navTitle">LEARN</div><nav class="nav"><button class="active" data-view="home">⌂ Home</button><button data-view="course">▦ 31-week course</button><button data-view="review">↻ 5-minute review</button><button data-view="terms">ع Grammar terms</button><button data-view="progress">↗ My progress</button></nav><div class="progressBox"><div class="navTitle" style="padding-left:0">YOUR PATH</div><div class="bar"><i id="sideBar"></i></div><div class="sideStats"><span id="sideDone">0/31</span><span id="sidePct">0%</span></div></div><div class="method"><b>THE LOOP</b><br>Retrieve → recognise → explain → find it again.</div></aside>
<main id="main"></main></div><div id="toast" class="toast"></div>

<script>
'use strict';
const TERMS=window.Curriculum.terms;
const t=k=>{
const x=TERMS[k]||[k,""];
const reps=(state.cards["term:"+k]||state.cards["t-"+k]||{}).reps||0;
const first=reps<3&&x[2],shown=first?x[2]:x[1];
const trans=first&&x[3]?'<small class="term-transliteration" style="display:block;opacity:.62;font-size:.72em;direction:ltr">'+esc(x[3])+'</small>':"";
const gloss=first&&x[4]?'<small class="term-gloss" style="display:block;opacity:.76;font-size:.75em;line-height:1.3">'+esc(x[4])+'</small>':"";
return '<span class="term" data-term-key="'+esc(k)+'"><span class="en">'+esc(x[0])+'</span><span class="ar" lang="ar" dir="rtl">'+esc(shown||"")+'</span>'+trans+gloss+'</span>';
};
const tr=ks=>`<div class="terms">${ks.map(t).join('')}</div>`;
const C=window.Curriculum.studentLessons;
const STORE='8020-student-v2';let state=load(),view='home',selected=1,reviewMode='words',queue=[],pos=0,revealed=false;
function blank(){return{done:{},cards:{}}}function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return blank()}}function save(){localStorage.setItem(STORE,JSON.stringify(state));updateSide()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function done(){return Object.values(state.done).filter(Boolean).length}function pct(){return Math.round(done()/31*100)}function updateSide(){document.getElementById('sideBar').style.width=pct()+'%';document.getElementById('sideDone').textContent=done()+'/31';document.getElementById('sidePct').textContent=pct()+'%'}
function wordCards(){return C.flatMap(x=>(x.words||[]).map((w,i)=>({key:`w${x.n}-${i}`,ar:w[0],en:w[1],week:x.n,kind:'word'})))}
function highCards(){let a=[],seen=new Set();C.forEach(x=>(x.hf||[]).forEach(w=>{if(!seen.has(w[0])){seen.add(w[0]);a.push({key:'h-'+w[0],ar:w[0],en:w[1],kind:'high'})}}));return a}
function termCards(){return Object.entries(TERMS).map(([k,v])=>{let first=(state.cards['term:'+k]?.reps||state.cards['t-'+k]?.reps||0)<3&&v[2];return {key:'t-'+k,termKey:k,en:v[0],ar:first?v[2]:v[1],transliteration:first?v[3]:'',gloss:first?v[4]:'',kind:'term'}})}
function cards(){return reviewMode==='terms'?termCards():reviewMode==='high'?highCards():wordCards()}
function nextWeek(){return C.find(x=>!state.done[x.n])||C[30]}
function summary(x){return x.checkpoint?'Al-Fātiḥah retrieval checkpoint':x.capstone?'Choose your own memorised page':`Madani 15-line Mushaf · p. ${x.page} · ${x.title}`}
function weekButton(x){return `<button class="week ${state.done[x.n]?'done':''}" data-week="${x.n}"><span class="num">${state.done[x.n]?'✓':String(x.n).padStart(2,'0')}</span><span><b>Week ${x.n} · ${esc(x.title)}</b><small>${esc(summary(x))}</small></span><span class="status eyebrow">${state.done[x.n]?'DONE':'OPEN →'}</span></button>`}
function home(){let n=nextWeek(),known=wordCards().filter(x=>(state.cards[x.key]?.reps||0)>=4).length;document.getElementById('main').innerHTML=`<section class="hero"><div><div class="kicker">QUR’AN-FIRST · 80/20 METHOD</div><h1>See the Qur’an.<br>Understand the structure.</h1><p>Start with whole Qur’anic phrases, study only the structural map needed to read them, then return to the same text and retrieve the pattern on another memorised page. Hifz remains the priority.</p><div class="actions"><button class="btn gold" id="continue">Continue Week ${n.n} →</button><button class="btn light" id="reviewBtn">5-minute review</button></div></div><div class="heroGlyph ar">ع</div></section>${WeeklyGuide.renderPriority()+WeeklyGuide.renderLibrarySetup()}<div class="metrics"><div class="metric"><small>COURSE PROGRESS</small><strong>${pct()}%</strong><span>${done()} of 31 weeks</span></div><div class="metric"><small>WORDS ESTABLISHED</small><strong>${known}</strong><span>4+ successful recalls</span></div><div class="metric"><small>REVIEW CARDS</small><strong>${Object.keys(state.cards).length}</strong><span>stored locally</span></div><div class="metric"><small>WEEKLY CLASS</small><strong>45m</strong><span>plus short practice</span></div></div><div class="grid2"><section class="card"><div class="eyebrow">NEXT LESSON</div><h2>Week ${n.n} · ${esc(n.title)}</h2><div class="target"><div class="eyebrow">TARGET</div>${tr(n.focus)}<p>${esc(n.objective)}</p></div><button class="btn" id="open">Open lesson →</button></section><section class="card"><div class="eyebrow">FAST MASTERY LOOP</div><div class="tasks"><div class="task"><b>1</b><span><strong>Retrieve</strong><br>Try before looking.</span></div><div class="task"><b>2</b><span><strong>Recognise</strong><br>Spot the Arabic evidence.</span></div><div class="task"><b>3</b><span><strong>Explain</strong><br>Name the English + Arabic term.</span></div><div class="task"><b>4</b><span><strong>Transfer</strong><br>Find it on another page.</span></div></div></section></div><div class="phase">UP NEXT</div><div class="weekList">${C.filter(x=>x.n>=n.n&&x.n<n.n+3).map(weekButton).join('')}</div>`;document.getElementById('continue').onclick=()=>open(n.n);document.getElementById('open').onclick=()=>open(n.n);document.getElementById('reviewBtn').onclick=()=>startReview('words');bindWeeks();}
function course(){let groups=[['PHASE 1 · FOUNDATIONS',C.slice(0,7)],['CHECKPOINT 1',C.slice(7,8)],['PHASE 2 · RELATIONSHIPS',C.slice(8,15)],['CHECKPOINT 2',C.slice(15,16)],['PHASE 3 · CONNECTED MEANING',C.slice(16,23)],['CHECKPOINT 3',C.slice(23,24)],['PHASE 4 · INDEPENDENT READING',C.slice(24,31)]];document.getElementById('main').innerHTML=`<div class="kicker">THE FULL PATH</div><h1>31 weeks to independent reading</h1><p class="card" style="color:var(--muted)">The sequence deliberately moves from recognition → relationships → connected meaning → independent analysis. Grammar terms are always stored as English + Arabic pairs.</p>${groups.map(g=>`<div class="phase">${g[0]}</div><div class="weekList">${g[1].map(weekButton).join('')}</div>`).join('')}`;bindWeeks()}
function bindWeeks(){document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>open(+b.dataset.week))}
function open(n){selected=n;view='lesson';render()}
function lesson(x){let s=x.checkpoint?checkpoint(x):lessonBody(x);if(x.checkpoint)s+=WeeklyGuide.renderSequence(x.n,{esc:esc});document.getElementById('main').innerHTML=`<div class="lessonHead"><div><button class="btn light noPrint" id="back">← Course</button><div class="kicker">WEEK ${String(x.n).padStart(2,'0')} · ${x.checkpoint?'RETRIEVAL CHECKPOINT':'45-MINUTE CLASS'}</div><h1>${esc(x.title)}</h1><p>${esc(summary(x))}</p></div></div>${WeeklyGuide.renderPriority()}${s}<section class="card noPrint" style="margin-top:13px"><div class="eyebrow">FINISH</div><p>Before you finish, explain the main idea without notes and point to one Arabic clue.</p><label class="task"><input type="checkbox" id="complete" ${state.done[x.n]?'checked':''}> I can recognise this feature and explain one Arabic clue.</label><div class="actions" style="margin-top:10px"><button class="btn" id="saveWeek">${state.done[x.n]?'Update completion':'Mark week complete'}</button><button class="btn light" id="next">Next week →</button><button class="btn light" id="printLesson">Print lesson</button></div></section>`;document.getElementById('back').onclick=()=>{view='course';render()};document.getElementById('saveWeek').onclick=()=>{state.done[x.n]=document.getElementById('complete').checked;save();toast(state.done[x.n]?'Week completed':'Completion removed');lesson(x)};document.getElementById('next').onclick=()=>open(Math.min(31,x.n+1));document.getElementById('printLesson').onclick=()=>window.print();bindReveal();WeeklyGuide.bind(x.n)}
function lessonBody(x){let words=x.capstone?Array.from({length:7},(_,i)=>`<div class="word"><div class="eyebrow">YOUR WORD ${i+1}</div><input class="cue ar" placeholder="اكتب الكلمة هنا" aria-label="Arabic word ${i+1}"><input class="cue" placeholder="meaning / root / cue"></div>`).join(''):x.words.map((z,i)=>`<div class="word"><span class="ar">${esc(z[0])}</span><div class="meaning hidden" id="m${x.n}-${i}">${esc(z[1])}</div><button data-reveal="${x.n}-${i}">Reveal meaning</button><input class="cue" placeholder="my memory cue" aria-label="memory cue"></div>`).join('');return `<section class="card" style="margin-top:14px"><div class="eyebrow">THIS WEEK’S TARGET · ENGLISH + ARABIC</div>${tr(x.focus)}<p>${esc(x.objective)}</p></section><div class="lessonGrid"><section class="card"><div class="eyebrow">${x.capstone?'CHOOSE SEVEN WORDS':'7 NEW QUR’AN WORDS'}</div><div class="words" style="margin-top:9px">${words}</div></section><section><div class="high"><div class="eyebrow">HIGH-FREQUENCY QUR’AN WORDS</div><p>These recurring function words have their own review set; they do not consume the seven lexical-word slots.</p><div class="highWords">${(x.hf||[]).map(z=>`<span class="highWord"><span class="ar">${esc(z[0])}</span><small>${esc(z[1])}</small></span>`).join('')}</div></div><div class="micro"><div class="microBox"><div class="eyebrow">NAḤW · نحو</div><p>${esc(WeeklyGuide.get(x.n).nahw)}</p>${tr(x.focus.filter(k=>['noun','verb','particle','nominal','verbal','mubtada','khabar','faail','mafool','preposition','genitive','jarMajrur','conjunction','idafah','pronoun','adjective','relativePronoun','relativeClause','inna','emphasis','kana','laysa','negation','jussive','subjunctive','passive','naib','condition','result','exception','question','vocative','oath','zarf','purpose','purposeLam','haal','dual','number','restriction','absolute','particleChoice','tarkib','agreement','manMa'].includes(k)))}</div><div class="microBox sarf"><div class="eyebrow">ṢARF · صرف</div><p>${esc(WeeklyGuide.get(x.n).sarf)}</p>${tr(x.focus.filter(k=>['past','imperfect','imperative','attachedPronoun','derived','activeParticiple','passiveParticiple','pattern','root','conjugation','weak'].includes(k)))}</div></div></section></div>${WeeklyGuide.renderSequence(x.n,{passage:x.passage,apply:x.apply,nahw:x.nahw,sarf:x.sarf,esc:esc})}`}
function checkpoint(x){return `<section class="checkpoint" style="margin-top:14px"><div class="eyebrow" style="color:#a9c4b6">AL-FĀTIḤAH · NO NOTES FIRST</div><h2>${esc(x.title)}</h2><p>${esc(x.objective)}</p>${tr(x.focus)}<div class="retrieval" style="margin-top:14px;background:#fff;color:var(--ink)"><b>Checkpoint rule:</b> use the Arabic evidence to justify each answer. The weekly source-page sequence and recognition test follow below.</div></section>`}
function bindReveal(){document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{let e=document.getElementById('m'+b.dataset.reveal);e.classList.toggle('hidden');b.textContent=e.classList.contains('hidden')?'Reveal meaning':'Hide meaning'})}
function review(){let list=cards(),due=list.filter(x=>state.cards[x.key]?.due<=today());if(!due.length)due=list.filter(x=>!(state.cards[x.key]?.reps));if(!due.length)due=list.slice(0,10);queue=due.slice(0,10);pos=0;revealed=false;view='review';render()}
function startReview(m){reviewMode=m;review();}
function today(){return new Date().toISOString().slice(0,10)}function addDays(n){let d=new Date(today()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function reviewView(){if(!queue.length){review();return}let c=queue[pos];let termMode=c.kind==='term';document.getElementById('main').innerHTML=`<div class="kicker">5-MINUTE RETRIEVAL · ${reviewMode==='terms'?'ENGLISH ↔ ARABIC TERMS':reviewMode==='high'?'HIGH-FREQUENCY':'QUR’AN VOCABULARY'}</div><h1>Make recall automatic</h1><div class="actions noPrint"><button class="btn ${reviewMode==='words'?'':'light'}" id="rw">Qur’an vocabulary</button><button class="btn ${reviewMode==='high'?'':'light'}" id="rh">High-frequency words</button><button class="btn ${reviewMode==='terms'?'':'light'}" id="rt">Grammar terms · مصطلحات</button></div><div class="review"><div class="flash"><div class="eyebrow" style="color:#c7d8d0">CARD ${pos+1} OF ${queue.length}</div>${termMode?`<div class="flashTerm">${esc(c.en)}</div>`:`<span class="ar">${esc(c.ar)}</span>`}<div class="answer">${revealed?(termMode?`<span class="ar">${esc(c.ar)}</span>${c.transliteration?`<small class="term-transliteration" style="display:block;opacity:.62;font-size:.72em;direction:ltr">${esc(c.transliteration)}</small>`:""}`:esc(c.en)):(termMode?'Recall the Arabic term':'Try to recall the meaning')}</div><button class="topBtn" id="reveal" style="margin-top:16px">${revealed?'Answer revealed':'Reveal answer'}</button></div>${revealed?`<div class="rating"><button data-rate="again">Again<br><small>not recalled</small></button><button data-rate="hard">Hard<br><small>needed effort</small></button><button data-rate="good">Good<br><small>recalled</small></button><button data-rate="easy">Easy<br><small>instant</small></button></div>`:''}</div>`;document.getElementById('rw').onclick=()=>startReview('words');document.getElementById('rh').onclick=()=>startReview('high');document.getElementById('rt').onclick=()=>startReview('terms');document.getElementById('reveal').onclick=()=>{revealed=true;reviewView()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(c,b.dataset.rate))}
function rate(c,r){let p=state.cards[c.key]||{reps:0,interval:0,ease:2.4};let iv=1;if(r==='again'){p.reps=0;p.ease=Math.max(1.3,p.ease-.2);iv=0}else if(r==='hard'){p.reps++;p.ease=Math.max(1.3,p.ease-.12);iv=Math.max(1,Math.round((p.interval||1)*1.35))}else if(r==='good'){p.reps++;iv=p.interval?Math.max(2,Math.round(p.interval*p.ease)):2}else{p.reps++;p.ease=Math.min(3.1,p.ease+.15);iv=p.interval?Math.max(4,Math.round(p.interval*(p.ease+.8))):4}p.interval=iv;p.due=iv?addDays(iv):today();state.cards[c.key]=p;save();pos++;revealed=false;if(pos>=queue.length){toast('Review set complete');queue=[]}else render()}
function terms(){document.getElementById('main').innerHTML=`<div class="kicker">BILINGUAL GRAMMAR MAP</div><h1>English ↔ Arabic terminology</h1><p class="card" style="color:var(--muted)">Every technical grammar label is paired. Say both sides aloud. Cover one side and retrieve the other.</p><div class="refGrid">${Object.keys(TERMS).map(k=>`<div class="card">${t(k)}</div>`).join('')}</div>`}
function progress(){let known=wordCards().filter(x=>(state.cards[x.key]?.reps||0)>=4).length;document.getElementById('main').innerHTML=`<div class="kicker">YOUR RECORD</div><h1>Progress you can trust</h1><div class="metrics"><div class="metric"><small>WEEKS COMPLETE</small><strong>${done()}/31</strong></div><div class="metric"><small>WORDS ESTABLISHED</small><strong>${known}</strong></div><div class="metric"><small>CARDS REVIEWED</small><strong>${Object.keys(state.cards).length}</strong></div><div class="metric"><small>COURSE</small><strong>${pct()}%</strong></div></div><section class="card"><div class="eyebrow">PHASE PROGRESS</div><div class="tracker" style="margin-top:12px">${[['Foundations',1,7],['Relationships',9,15],['Connected meaning',17,23],['Independent reading',25,31]].map(p=>{let d=0;for(let i=p[1];i<=p[2];i++)d+=state.done[i]?1:0;return `<div class="trackCard"><b>${d}/${p[2]-p[1]+1}</b><small>${p[0]}</small></div>`}).join('')}</div></section><section class="card" style="margin-top:12px"><div class="eyebrow">KEEP IT PORTABLE</div><p>Progress stays in this browser. Export a backup before changing device, then import it on the other student screen or device.</p><div class="actions"><button class="btn" id="export2">Export progress</button><button class="btn light" id="import2Btn">Import progress backup</button><input id="import2" type="file" accept="application/json,.json" hidden></div></section>`;document.getElementById('export2').onclick=exportProgress;document.getElementById('import2Btn').onclick=()=>document.getElementById('import2').click();document.getElementById('import2').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;f.text().then(txt=>{try{state=Object.assign(blank(),ProgressTransfer.toStudent(JSON.parse(txt)));save();render();toast('Progress restored')}catch(err){toast(err&&err.message?err.message:'This was not recognised as a progress backup')}e.target.value=''})})}
function exportProgress(){ProgressTransfer.download({cards:state.cards,done:state.done},"80-20-arabic-progress.json");toast("Progress backup exported")}
function render(){updateSide();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='home')home();else if(view==='course')course();else if(view==='lesson')lesson(C.find(x=>x.n===selected));else if(view==='review')reviewView();else if(view==='terms')terms();else progress()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('export').onclick=exportProgress;document.getElementById('print').onclick=()=>window.print();render();
</script>
</body></html>
