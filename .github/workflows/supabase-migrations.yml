name: Validate Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches: ["main"]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Apply migrations to a clean database
        run: supabase db reset

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
