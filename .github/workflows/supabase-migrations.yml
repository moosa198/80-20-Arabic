name: Validate Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches: ["main"]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start isolated Postgres only
        # Migration smoke tests need Postgres, not the rest of the Supabase services.
        # This reduces image pulls and makes CI less sensitive to container-registry rate limits.
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations to a clean database
        run: supabase db reset

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
