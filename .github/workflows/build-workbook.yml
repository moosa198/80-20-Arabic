name: Build and audit student workbook
on:
  push:
    branches: ["main", "build/structure-first-recognition", "feature/teacher-progress-sourcepages-translit"]
    paths:
      - "index.html"
      - "student.html"
      - "teacher.html"
      - "weekly-guide.js"
      - "recognition.js"
      - "grammar-terms.js"
      - "learner-tools.js"
      - "source-pages.js"
      - "scripts/build-fstu-extracts.py"
      - "scripts/build-workbook.cjs"
      - "README.md"
      - "CURRICULUM-AUDIT.md"
      - ".github/workflows/build-workbook.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the course
        uses: actions/checkout@v4
      - name: Build exact page-only FSTU extracts
        run: |
          python -m pip install --disable-pip-version-check pypdf
          python scripts/build-fstu-extracts.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chromium and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render lessons, audit sources and build workbook
        run: node scripts/build-workbook.cjs
      - name: Upload workbook and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-workbook-and-qa
          path: dist/
          if-no-files-found: warn
          retention-days: 21
      - name: Commit page extracts, source map and printable workbook
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fstu-nahw-extracts.pdf assets/fstu-sarf-extracts.pdf assets/fstu-page-map.json dist/Student_Workbook.pdf
          if git diff --cached --quiet; then
            echo "Extracts and printable workbook are unchanged."
          else
            git commit -m "Update assigned FSTU page extracts and workbook"
            git push
          fi
