W(25,"Al-Kahf 5–8",294,["manMa","relativePronoun","negation","particleChoice"],"Use context to distinguish recurring forms such as من and ما.",[["أَفْوَاه","mouths"],["كَذِبًا","falsehood"],["زِينَة","adornment"],["نَبْلُوَهُمْ","we test them"],["أَحْسَن","best"],["صَعِيدًا","surface / ground"],["جُرُزًا","barren"]],[["مَنْ","who / whoever"],["مَا","what / whatever / not by context"],["الَّذِي","who / which"],["إِنْ","if"],["إِنَّ","indeed"]],"The same written form can serve different functions in different contexts. Check what follows, what the phrase needs, and whether the meaning fits the wider statement.","Do not force a single translation on a recurring form. Notice its shape, then test its role against the surrounding words.","On page 294, compare the uses of ما in ما لهم به من علم and ما على الأرض. Explain what changes with the context.","Use the FSTU Naḥw (نحو) index for connected forms, relative forms and negation."),

W(27,"Al-Fajr 21–30",593,["absolute","mafool","verb","pattern"],"Recognise an expression that repeats or reinforces the action's meaning.",[["دَكًّا","a shattering"],["صَفًّا","in rows"],["جِيءَ","was brought"],["جَهَنَّم","Hell"],["الْإِنْسَان","the human being"],["نَفْس","self / soul"],["رَاضِيَة","pleased"]],[["وَ","and"],["فَـ","so / then"],["ثُمَّ","then"],["إِنَّ","indeed"],["لَا","not"]],"An expression can repeat or reinforce the meaning of the action. The phrase دَكًّا دَكًّا is a clear example: identify the main action and explain how the repeated expression reinforces it.","Compare the action and the related form. Shared roots can help you see the relationship.","On page 593, find دَكًّا دَكًّا or صَفًّا صَفًّا. Mark the action and explain the function of the repeated expression.","Use the FSTU Naḥw (نحو) index for مفعول مطلق. Review roots and patterns in FSTU Ṣarf (صرف)."),

function dueQueue(){var d=due();if(d.length)return d;var s=state(),fresh=allWords().filter(function(x){return !s.cards[x.key]||!s.cards[x.key].reps});var upto=next().n;var q=fresh.filter(function(x){return x.week<=upto});return (q.length?q:allWords().sort(function(a,b){return ((s.cards[a.key]||{}).last||"").localeCompare((s.cards[b.key]||{}).last||"")}).slice(0,10)).slice(0,10)}

function rate(w,r){var s=state(),p=s.cards[w.key]||{reps:0,interval:0,ease:2.4},iv=1;if(r==="again"){iv=0;p.reps=0;p.ease=Math.max(1.3,p.ease-.2)}else if(r==="hard"){iv=Math.max(1,Math.round((p.interval||1)*1.35));p.reps++;p.ease=Math.max(1.3,p.ease-.12)}else if(r==="good"){iv=p.interval?Math.max(2,Math.round(p.interval*p.ease)):2;p.reps++}else{iv=p.interval?Math.max(4,Math.round(p.interval*(p.ease+.8))):4;p.reps++;p.ease=Math.min(3.1,p.ease+.15)}p.interval=iv;p.due=iv===0?date():after(date(),iv);p.last=date();s.cards[w.key]=p;if(s.lastSession!==date()){s.streak=s.lastSession===after(date(),-1)?(s.streak||0)+1:Math.max(1,s.streak||0);s.lastSession=date()}s.seconds=(s.seconds||0)+25;save(s);pos++;revealed=false;if(pos>=queue.length)toast("Review set complete — nice work");reviewView()}
